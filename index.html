<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xenerator</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/zxkuhl/KEY-system/refs/heads/main/X%20logo.png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;800&display=swap" rel="stylesheet">

<style>
/* === Reset & Body === */
body {
  margin:0;
  padding:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(135deg, #0a0010 0%, #1a051a 25%, #0d000d 50%, #150315 75%, #0a0010 100%);
  color:white;
  position: relative;
  overflow: hidden;
}

/* Static particles effect */
body::before {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(75, 0, 130, 0.12) 0%, transparent 40%),
    radial-gradient(circle at 40% 80%, rgba(128, 0, 128, 0.1) 0%, transparent 40%);
  pointer-events: none;
}

/* === Discord Button === */
.discord-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg, #8b2fc9, #6b22ab, #4b1a8d);
  border: 2px solid rgba(138, 43, 226, 0.5);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  z-index: 1000;
  box-shadow: 
    0 6px 20px rgba(138, 43, 226, 0.4),
    0 0 30px rgba(138, 43, 226, 0.2),
    inset 0 1px 0 rgba(255, 255, 255, 0.1),
    inset 0 -1px 0 rgba(0, 0, 0, 0.5);
  text-decoration: none;
  overflow: hidden;
}

.discord-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, 
    transparent, 
    rgba(255, 255, 255, 0.2), 
    transparent);
  transition: left 0.6s ease;
}

.discord-btn:hover::before {
  left: 100%;
}

.discord-btn:hover {
  background: linear-gradient(135deg, #a347e0, #8b2fc9, #6b22ab);
  border-color: rgba(138, 43, 226, 0.8);
  box-shadow: 
    0 10px 30px rgba(138, 43, 226, 0.6),
    0 0 50px rgba(138, 43, 226, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.15),
    inset 0 -1px 0 rgba(0, 0, 0, 0.5);
  transform: translateY(-2px);
}

.discord-btn:active {
  transform: translateY(0) scale(0.98);
}

.discord-btn svg {
  width: 32px;
  height: 32px;
  fill: #e0e0e0;
  filter: drop-shadow(0 0 8px rgba(138, 43, 226, 0.5));
  transition: all 0.3s ease;
}

.discord-btn:hover svg {
  fill: #fff;
  filter: drop-shadow(0 0 12px rgba(138, 43, 226, 0.7));
}

@media (max-width: 768px) {
  .discord-btn {
    width: 50px;
    height: 50px;
    top: 15px;
    right: 15px;
  }
  .discord-btn svg {
    width: 26px;
    height: 26px;
  }
}

/* === Modal Overlay === */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(10px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 2000;
  animation: fadeIn 0.3s ease;
}

.modal-overlay.active {
  display: flex;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideIn {
  from {
    transform: translateY(-50px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

/* === Modal Box === */
.modal-box {
  background: linear-gradient(145deg, #1a051a 0%, #0d000d 50%, #150315 100%);
  padding: 40px 35px;
  border-radius: 20px;
  box-shadow: 
    0 25px 70px rgba(0, 0, 0, 0.95),
    0 0 100px rgba(138, 43, 226, 0.4),
    inset 0 1px 1px rgba(200, 100, 255, 0.1);
  border: 2px solid rgba(138, 43, 226, 0.5);
  text-align: center;
  max-width: 90%;
  width: 420px;
  position: relative;
  animation: slideIn 0.4s ease;
}

.modal-box h2 {
  margin: 0 0 20px 0;
  font-family: 'Rajdhani', sans-serif;
  font-size: 32px;
  background: linear-gradient(135deg, #b47ede, #8b2fc9);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
  filter: drop-shadow(0 0 15px rgba(138, 43, 226, 0.5));
}

.modal-box p {
  color: #b8b8b8;
  font-size: 16px;
  margin-bottom: 30px;
  line-height: 1.6;
}

.modal-join-btn {
  background: linear-gradient(135deg, #8b2fc9, #6b22ab, #4b1a8d);
  color: #e0e0e0;
  border: 2px solid rgba(138, 43, 226, 0.5);
  border-radius: 12px;
  padding: 16px 45px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 2px;
  box-shadow: 
    0 6px 20px rgba(138, 43, 226, 0.4),
    0 0 30px rgba(138, 43, 226, 0.2),
    inset 0 1px 0 rgba(255, 255, 255, 0.1),
    inset 0 -1px 0 rgba(0, 0, 0, 0.5);
  position: relative;
  overflow: hidden;
  text-decoration: none;
  display: inline-block;
}

.modal-join-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, 
    transparent, 
    rgba(255, 255, 255, 0.2), 
    transparent);
  transition: left 0.6s ease;
}

.modal-join-btn:hover::before {
  left: 100%;
}

.modal-join-btn:hover {
  background: linear-gradient(135deg, #a347e0, #8b2fc9, #6b22ab);
  border-color: rgba(138, 43, 226, 0.8);
  color: #fff;
  box-shadow: 
    0 10px 30px rgba(138, 43, 226, 0.6),
    0 0 50px rgba(138, 43, 226, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.15),
    inset 0 -1px 0 rgba(0, 0, 0, 0.5);
  transform: translateY(-2px);
}

.modal-join-btn:active {
  transform: scale(0.98);
}

/* === Container Card === */
.card {
  background: linear-gradient(145deg, #1a051a 0%, #0d000d 50%, #150315 100%);
  padding:50px 40px;
  border-radius:24px;
  box-shadow: 
    0 20px 60px rgba(0, 0, 0, 0.9),
    0 0 80px rgba(138, 43, 226, 0.3),
    inset 0 1px 1px rgba(200, 100, 255, 0.1);
  border: 1px solid rgba(138, 43, 226, 0.3);
  text-align:center;
  width: 400px;
  max-width: 90%;
  position: relative;
  z-index: 10;
  backdrop-filter: blur(10px);
  transition: all 0.4s ease;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  border-radius: 24px;
  padding: 2px;
  background: linear-gradient(135deg, 
    rgba(138, 43, 226, 0.3), 
    rgba(75, 0, 130, 0.2), 
    rgba(138, 43, 226, 0.3));
  -webkit-mask: 
    linear-gradient(#fff 0 0) content-box, 
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.card:hover {
  box-shadow: 
    0 25px 70px rgba(0, 0, 0, 0.95),
    0 0 100px rgba(138, 43, 226, 0.4),
    inset 0 1px 1px rgba(200, 100, 255, 0.15);
  border-color: rgba(138, 43, 226, 0.5);
}

/* Logo */
.logo {
  width: 110px;
  height: 110px;
  margin: 0 auto 30px;
  display: block;
  filter: drop-shadow(0 0 25px rgba(138, 43, 226, 0.5));
  transition: all 0.3s ease;
}

.logo:hover {
  filter: drop-shadow(0 0 35px rgba(138, 43, 226, 0.7));
  transform: scale(1.05);
}

.card h1 {
  margin-bottom:15px;
  font-family: 'Rajdhani', sans-serif;
  font-size: 48px;
  background: linear-gradient(135deg, #b47ede, #8b2fc9, #6b22ab, #8b2fc9);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 800;
  letter-spacing: 8px;
  filter: drop-shadow(0 0 15px rgba(138, 43, 226, 0.5));
  position: relative;
  text-transform: uppercase;
}

.card h1::after {
  content: '';
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 3px;
  background: linear-gradient(90deg, transparent, rgba(138, 43, 226, 0.8), transparent);
  box-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
}

.card p {
  font-size:15px;
  margin-bottom:35px;
  margin-top: 25px;
  color:#a8a8a8;
  font-weight: 400;
  line-height: 1.6;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
}

/* === Button === */
.delta-btn {
  background: linear-gradient(135deg, #8b2fc9, #6b22ab, #4b1a8d);
  color:#e0e0e0;
  border: 2px solid rgba(138, 43, 226, 0.5);
  border-radius:12px;
  padding:16px 40px;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 2px;
  box-shadow: 
    0 6px 20px rgba(138, 43, 226, 0.4),
    0 0 30px rgba(138, 43, 226, 0.2),
    inset 0 1px 0 rgba(255, 255, 255, 0.1),
    inset 0 -1px 0 rgba(0, 0, 0, 0.5);
  position: relative;
  overflow: hidden;
}

.delta-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, 
    transparent, 
    rgba(255, 255, 255, 0.2), 
    transparent);
  transition: left 0.6s ease;
}

.delta-btn:hover::before {
  left: 100%;
}

.delta-btn:hover {
  background: linear-gradient(135deg, #a347e0, #8b2fc9, #6b22ab);
  border-color: rgba(138, 43, 226, 0.8);
  color: #fff;
  box-shadow: 
    0 10px 30px rgba(138, 43, 226, 0.6),
    0 0 50px rgba(138, 43, 226, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.15),
    inset 0 -1px 0 rgba(0, 0, 0, 0.5);
}

.delta-btn:active {
  transform: scale(0.98);
  box-shadow: 
    0 5px 15px rgba(138, 43, 226, 0.5),
    0 0 30px rgba(138, 43, 226, 0.2);
}

/* === Output Box === */
#output {
  margin-top:30px;
  padding:18px;
  background: linear-gradient(145deg, #0d000d, #1a051a);
  border-radius:10px;
  color:#c299e6;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  font-weight: 600;
  word-wrap: break-word;
  overflow-wrap: break-word;
  white-space: pre-wrap;
  user-select: all;
  border: 1px solid rgba(138, 43, 226, 0.4);
  box-shadow: 
    inset 0 3px 10px rgba(0, 0, 0, 0.7),
    0 0 20px rgba(138, 43, 226, 0.2);
  min-height: 20px;
  text-shadow: 0 0 8px rgba(194, 153, 230, 0.4);
  max-width: 100%;
  box-sizing: border-box;
}

#output:empty {
  display: none;
}

/* === Copied message === */
#copiedMsg {
  margin-top:15px;
  font-size:14px;
  color:#b380d9;
  opacity:0;
  transition: opacity 0.4s ease;
  font-weight: 600;
  text-shadow: 0 0 10px rgba(179, 128, 217, 0.6);
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<!-- Discord Modal -->
<div id="discordModal" class="modal-overlay">
  <div class="modal-box">
    <h2>Join Discord First!</h2>
    <p>You must join our Discord server before generating a key. Click the button below to join!</p>
    <a href="https://discord.gg/KPUPp4m9pJ" target="_blank" class="modal-join-btn" id="joinDiscordBtn">Join Discord!</a>
  </div>
</div>

<!-- Discord Button -->
<a href="https://discord.gg/KPUPp4m9pJ" target="_blank" class="discord-btn" title="Join our Discord">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 127.14 96.36">
    <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
  </svg>
</a>

<div class="card">
  <img src="https://raw.githubusercontent.com/zxkuhl/KEY-system/refs/heads/main/X%20logo.png" alt="Logo" class="logo">
  <h1>Xenerator</h1>
  <p>Click the button to generate your whitelist key.</p>
  <button id="genKey" class="delta-btn">Generate Key</button>
  <pre id="output"></pre>
  <div id="copiedMsg">Copied to clipboard!</div>
</div>

<script>
// === Firebase config ===
const firebaseConfig = {
  apiKey: "AIzaSyCDYErDzkUObLnPWJUwqOQcceqS2WyUWyM",
  authDomain: "key-system-5efa4.firebaseapp.com",
  databaseURL: "https://key-system-5efa4-default-rtdb.firebaseio.com/",
  projectId: "key-system-5efa4",
  storageBucket: "key-system-5efa4.appspot.com",
  messagingSenderId: "862359412770",
  appId: "1:862359412770:web:f55b955364b329dfbaa7b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const systemRef = db.ref("system"); 

function makeKey(){ return "FREE-" + Math.floor(Math.random()*1e10); }

function formatTimeRemaining(ms) {
  const minutes = Math.floor(ms / 60000);
  const seconds = Math.floor((ms % 60000) / 1000);
  return `${minutes}m ${seconds}s`;
}

const genKeyBtn = document.getElementById("genKey");
const output = document.getElementById("output");
const copiedMsg = document.getElementById("copiedMsg");
const discordModal = document.getElementById("discordModal");
const joinDiscordBtn = document.getElementById("joinDiscordBtn");

// Check if user has joined Discord before
function hasJoinedDiscord() {
  return localStorage.getItem("discordJoined") === "true";
}

// Mark that user has clicked join Discord
joinDiscordBtn.onclick = () => {
  localStorage.setItem("discordJoined", "true");
  setTimeout(() => {
    discordModal.classList.remove("active");
  }, 300);
};

// Handle visibility change to detect when user returns to tab
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && discordModal.classList.contains("active")) {
    // User returned to the tab, assume they joined Discord
    localStorage.setItem("discordJoined", "true");
    discordModal.classList.remove("active");
  }
});

genKeyBtn.onclick = ()=>{
  // Check if user has joined Discord
  if (!hasJoinedDiscord()) {
    discordModal.classList.add("active");
    return;
  }

  // Check cooldown
  const lastGen = localStorage.getItem("lastGen");
  const oneHour = 3600000; // 1 hour in milliseconds
  
  if (lastGen) {
    const timeSinceLastGen = Date.now() - parseInt(lastGen);
    if (timeSinceLastGen < oneHour) {
      const timeRemaining = oneHour - timeSinceLastGen;
      output.innerText = `Please wait ${formatTimeRemaining(timeRemaining)} before generating another key.`;
      return;
    }
  }

  systemRef.once("value", s=>{
    if(s.val() === false){
      output.innerText = "Key generation is disabled.";
      return;
    }
    const key = makeKey();
    const newKey = { key, active:true, expires:Date.now()+86400000, device:navigator.userAgent };
    db.ref("keys").push(newKey);
    output.innerText = key;
    localStorage.setItem("lastGen", Date.now());

    navigator.clipboard.writeText(key).then(()=>{
      copiedMsg.style.opacity = 1;
      setTimeout(()=>{copiedMsg.style.opacity=0;},1500);
    });
  });
};
</script>

</body>
</html>
