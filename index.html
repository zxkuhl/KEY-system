<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xenerator</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/zxkuhl/KEY-system/refs/heads/main/X%20logo.png">

<style>
/* === Reset & Body === */
body {
  margin:0;
  padding:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(135deg, #0a0010 0%, #1a051a 25%, #0d000d 50%, #150315 75%, #0a0010 100%);
  color:white;
  position: relative;
  overflow: hidden;
}
/* Static particles effect */
body::before {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(75, 0, 130, 0.12) 0%, transparent 40%),
    radial-gradient(circle at 40% 80%, rgba(128, 0, 128, 0.1) 0%, transparent 40%);
  pointer-events: none;
}
/* === Discord Button === */
.discord-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg, #8b2fc9, #6b22ab, #4b1a8d);
  border: 2px solid rgba(138, 43, 226, 0.5);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  z-index: 1000;
  box-shadow: 
    0 6px 20px rgba(138, 43, 226, 0.4),
    0 0 30px rgba(138, 43, 226, 0.2),
    inset 0 1px 0 rgba(255, 255, 255, 0.1),
    inset 0 -1px 0 rgba(0, 0, 0, 0.5);
  text-decoration: none;
  overflow: hidden;
}
.discord-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, 
    transparent, 
    rgba(255, 255, 255, 0.2), 
    transparent);
  transition: left 0.6s ease;
}
.discord-btn:hover::before {
  left: 100%;
}
.discord-btn:hover {
  background: linear-gradient(135deg, #a347e0, #8b2fc9, #6b22ab);
  border-color: rgba(138, 43, 226, 0.8);
  box-shadow: 
    0 10px 30px rgba(138, 43, 226, 0.6),
    0 0 50px rgba(138, 43, 226, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.15),
    inset 0 -1px 0 rgba(0, 0, 0, 0.5);
  transform: translateY(-2px);
}
.discord-btn:active {
  transform: translateY(0) scale(0.98);
}
.discord-btn svg {
  width: 32px;
  height: 32px;
  fill: #e0e0e0;
  filter: drop-shadow(0 0 8px rgba(138, 43, 226, 0.5));
  transition: all 0.3s ease;
}
.discord-btn:hover svg {
  fill: #fff;
  filter: drop-shadow(0 0 12px rgba(138, 43, 226, 0.7));
}
@media (max-width: 768px) {
  .discord-btn {
    width: 50px;
    height: 50px;
    top: 15px;
    right: 15px;
  }
  .discord-btn svg {
    width: 26px;
    height: 26px;
  }
}
/* === Modal Overlay === */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(10px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 2000;
  animation: fadeIn 0.3s ease;
}
.modal-overlay.active {
  display: flex;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes slideIn {
  from {
    transform: translateY(-50px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}
/* === Modal Box === */
.modal-box {
  background: linear-gradient(145deg, #1a051a 0%, #0d000d 50%, #150315 100%);
  padding: 40px 35px;
  border-radius: 20px;
  box-shadow: 
    0 25px 70px rgba(0, 0, 0, 0.95),
    0 0 100px rgba(138, 43, 226, 0.4),
    inset 0 1px 1px rgba(200, 100, 255, 0.1);
  border: 2px solid rgba(138, 43, 226, 0.5);
  text-align: center;
  max-width: 90%;
  width: 450px;
  position: relative;
  animation: slideIn 0.4s ease;
}
.modal-box h2 {
  margin: 0 0 15px 0;
  font-family: 'Rajdhani', sans-serif;
  font-size: 32px;
  background: linear-gradient(135deg, #b47ede, #8b2fc9);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
  filter: drop-shadow(0 0 15px rgba(138, 43, 226, 0.5));
}
.modal-box p {
  color: #b8b8b8;
  font-size: 15px;
  margin-bottom: 25px;
  line-height: 1.6;
}
/* Progress Steps */
.progress-steps {
  margin: 25px 0;
  display: flex;
  flex-direction: column;
  gap: 15px;
}
.step {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 20px;
  background: linear-gradient(145deg, #0d000d, #1a051a);
  border-radius: 12px;
  border: 1px solid rgba(138, 43, 226, 0.3);
  transition: all 0.3s ease;
}
.step.completed {
  border-color: rgba(138, 43, 226, 0.6);
  background: linear-gradient(145deg, #1a051a, #0d000d);
}
.step-info {
  display: flex;
  align-items: center;
  gap: 15px;
}
.step-number {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: linear-gradient(135deg, #8b2fc9, #6b22ab);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 16px;
  box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
}
.step.completed .step-number {
  background: linear-gradient(135deg, #4CAF50, #45a049);
  box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
}
.step-text {
  text-align: left;
}
.step-title {
  font-weight: 600;
  font-size: 15px;
  color: #e0e0e0;
  margin-bottom: 3px;
}
.step-desc {
  font-size: 12px;
  color: #888;
}
.step.completed .step-desc {
  color: #4CAF50;
}
.check-icon {
  color: #4CAF50;
  font-size: 20px;
  display: none;
}
.step.completed .check-icon {
  display: block;
}
.step.completed .step-number {
  display: none;
}
.step.completed .step-info {
  gap: 15px;
}
.step.completed .check-icon {
  width: 35px;
  height: 35px;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* Modal Buttons */
.modal-action-btn {
  background: linear-gradient(135deg, #8b2fc9, #6b22ab, #4b1a8d);
  color: #e0e0e0;
  border: 2px solid rgba(138, 43, 226, 0.5);
  border-radius: 12px;
  padding: 14px 35px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 2px;
  box-shadow: 
    0 6px 20px rgba(138, 43, 226, 0.4),
    0 0 30px rgba(138, 43, 226, 0.2),
    inset 0 1px 0 rgba(255, 255, 255, 0.1),
    inset 0 -1px 0 rgba(0, 0, 0, 0.5);
  position: relative;
  overflow: hidden;
  text-decoration: none;
  display: inline-block;
  margin-top: 10px;
}
.modal-action-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.modal-action-btn:not(:disabled)::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, 
    transparent, 
    rgba(255, 255, 255, 0.2), 
    transparent);
  transition: left 0.6s ease;
}
.modal-action-btn:not(:disabled):hover::before {
  left: 100%;
}
.modal-action-btn:not(:disabled):hover {
  background: linear-gradient(135deg, #a347e0, #8b2fc9, #6b22ab);
  border-color: rgba(138, 43, 226, 0.8);
  color: #fff;
  box-shadow: 
    0 10px 30px rgba(138, 43, 226, 0.6),
    0 0 50px rgba(138, 43, 226, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.15),
    inset 0 -1px 0 rgba(0, 0, 0, 0.5);
  transform: translateY(-2px);
}
.modal-action-btn:active {
  transform: scale(0.98);
}
/* === Container Card === */
.card {
  background: linear-gradient(145deg, #1a051a 0%, #0d000d 50%, #150315 100%);
  padding:50px 40px;
  border-radius:24px;
  box-shadow: 
    0 20px 60px rgba(0, 0, 0, 0.9),
    0 0 80px rgba(138, 43, 226, 0.3),
    inset 0 1px 1px rgba(200, 100, 255, 0.1);
  border: 1px solid rgba(138, 43, 226, 0.3);
  text-align:center;
  width: 400px;
  max-width: 90%;
  position: relative;
  z-index: 10;
  backdrop-filter: blur(10px);
  transition: all 0.4s ease;
}
.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  border-radius: 24px;
  padding: 2px;
  background: linear-gradient(135deg, 
    rgba(138, 43, 226, 0.3), 
    rgba(75, 0, 130, 0.2), 
    rgba(138, 43, 226, 0.3));
  -webkit-mask: 
    linear-gradient(#fff 0 0) content-box, 
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
.card:hover {
  box-shadow: 
    0 25px 70px rgba(0, 0, 0, 0.95),
    0 0 100px rgba(138, 43, 226, 0.4),
    inset 0 1px 1px rgba(200, 100, 255, 0.15);
  border-color: rgba(138, 43, 226, 0.5);
}
/* Logo */
.logo {

  height: 110px;
  margin: 0 auto 30px;
  display: block;
  filter: drop-shadow(0 0 25px rgba(138, 43, 226, 0.5));
  transition: all 0.3s ease;
}
.logo:hover {
  filter: drop-shadow(0 0 35px rgba(138, 43, 226, 0.7));
  transform: scale(1.05);
}
.card h1 {
  margin-bottom:15px;
  font-family: 'Rajdhani', sans-serif;
  font-size: 48px;

  background-clip: text;
  font-weight: 800;
  letter-spacing: 8px;
  filter: drop-shadow(0 0 15px rgba(138, 43, 226, 0.5));
  position: relative;
  text-transform: uppercase;
}
.card h1::after {
  content: '';
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 3px;
  background: linear-gradient(90deg, transparent, rgba(138, 43, 226, 0.8), transparent);
  box-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
}
.card p {
  font-size:15px;
  margin-bottom:35px;
  margin-top: 25px;
  color:#a8a8a8;
  font-weight: 400;
  line-height: 1.6;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
}
/* === Button === */
.delta-btn {
  background: linear-gradient(135deg, #8b2fc9, #6b22ab, #4b1a8d);

  border: 2px solid rgba(138, 43, 226, 0.5);
  border-radius:12px;
  padding:16px 40px;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 2px;
  box-shadow: 
    0 6px 20px rgba(138, 43, 226, 0.4),
    0 0 30px rgba(138, 43, 226, 0.2),
    inset 0 1px 0 rgba(255, 255, 255, 0.1),
    inset 0 -1px 0 rgba(0, 0, 0, 0.5);
  position: relative;
  overflow: hidden;
}
.delta-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, 
    transparent, 
    rgba(255, 255, 255, 0.2), 
    transparent);
  transition: left 0.6s ease;
}
.delta-btn:hover::before {
  left: 100%;
}
.delta-btn:hover {
  background: linear-gradient(135deg, #a347e0, #8b2fc9, #6b22ab);
  border-color: rgba(138, 43, 226, 0.8);
  color: #fff;
  box-shadow: 
    0 10px 30px rgba(138, 43, 226, 0.6),
    0 0 50px rgba(138, 43, 226, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.15),
    inset 0 -1px 0 rgba(0, 0, 0, 0.5);
}
.delta-btn:active {
  transform: scale(0.98);
  box-shadow: 
    0 5px 15px rgba(138, 43, 226, 0.5),
    0 0 30px rgba(138, 43, 226, 0.2);

/* === Output Box === */
#output {
  margin-top:30px;
  padding:18px;
  background: linear-gradient(145deg, #0d000d, #1a051a);
  border-radius:10px;
  color:#c299e6;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  font-weight: 600;
  word-wrap: break-word;
  overflow-wrap: break-word;
  white-space: pre-wrap;
  user-select: all;
  border: 1px solid rgba(138, 43, 226, 0.4);
  box-shadow: 
    inset 0 3px 10px rgba(0, 0, 0, 0.7),
    0 0 20px rgba(138, 43, 226, 0.2);
  min-height: 20px;
  text-shadow: 0 0 8px rgba(194, 153, 230, 0.4);
  max-width: 100%;
  box-sizing: border-box;
}
#output:empty {
  display: none;
}
/* === Copied message === */
#copiedMsg {
  margin-top:15px;
  font-size:14px;
  color:#b380d9;
  opacity:0;
  transition: opacity 0.4s ease;
  font-weight: 600;
  text-shadow: 0 0 10px rgba(179, 128, 217, 0.6);
}
</style>
