<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Xenerator</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/zxkuhl/KEY-system/main/XInject%20Logi.png">

<style>
/* === Reset & Body === */
body {
  margin:0;
  padding:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(135deg, #0a0000 0%, #1a0505 25%, #0d0000 50%, #150303 75%, #0a0000 100%);
  color:white;
  position: relative;
  overflow: hidden;
}

/* Static particles effect */
body::before {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(139, 0, 0, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(80, 0, 0, 0.12) 0%, transparent 40%),
    radial-gradient(circle at 40% 80%, rgba(100, 0, 0, 0.1) 0%, transparent 40%);
  pointer-events: none;
}

/* === Container Card === */
.card {
  background: linear-gradient(145deg, #1a0505 0%, #0d0000 50%, #150303 100%);
  padding:50px 40px;
  border-radius:24px;
  box-shadow: 
    0 20px 60px rgba(0, 0, 0, 0.9),
    0 0 80px rgba(139, 0, 0, 0.3),
    inset 0 1px 1px rgba(255, 50, 50, 0.1);
  border: 1px solid rgba(139, 0, 0, 0.3);
  text-align:center;
  width: 400px;
  position: relative;
  z-index: 10;
  backdrop-filter: blur(10px);
  transition: all 0.4s ease;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  border-radius: 24px;
  padding: 2px;
  background: linear-gradient(135deg, 
    rgba(139, 0, 0, 0.3), 
    rgba(80, 0, 0, 0.2), 
    rgba(139, 0, 0, 0.3));
  -webkit-mask: 
    linear-gradient(#fff 0 0) content-box, 
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.card:hover {
  box-shadow: 
    0 25px 70px rgba(0, 0, 0, 0.95),
    0 0 100px rgba(139, 0, 0, 0.4),
    inset 0 1px 1px rgba(255, 50, 50, 0.15);
  border-color: rgba(139, 0, 0, 0.5);
}

/* Logo */
.logo {
  width: 110px;
  height: 110px;
  margin: 0 auto 30px;
  display: block;
  filter: drop-shadow(0 0 25px rgba(139, 0, 0, 0.5));
  transition: all 0.3s ease;
}

.logo:hover {
  filter: drop-shadow(0 0 35px rgba(139, 0, 0, 0.7));
  transform: scale(1.05);
}

.card h1 {
  margin-bottom:15px;
  font-size:32px;
  background: linear-gradient(135deg, #b30000, #8b0000, #660000, #8b0000);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 800;
  letter-spacing: 4px;
  filter: drop-shadow(0 0 15px rgba(139, 0, 0, 0.5));
  position: relative;
}

.card h1::after {
  content: '';
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 3px;
  background: linear-gradient(90deg, transparent, rgba(139, 0, 0, 0.8), transparent);
  box-shadow: 0 0 10px rgba(139, 0, 0, 0.5);
}

.card p {
  font-size:15px;
  margin-bottom:35px;
  margin-top: 25px;
  color:#a8a8a8;
  font-weight: 400;
  line-height: 1.6;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
}

/* === Button === */
.delta-btn {
  background: linear-gradient(135deg, #8b0000, #660000, #4d0000);
  color:#e0e0e0;
  border: 2px solid rgba(139, 0, 0, 0.5);
  border-radius:12px;
  padding:16px 40px;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 2px;
  box-shadow: 
    0 6px 20px rgba(139, 0, 0, 0.4),
    0 0 30px rgba(139, 0, 0, 0.2),
    inset 0 1px 0 rgba(255, 255, 255, 0.1),
    inset 0 -1px 0 rgba(0, 0, 0, 0.5);
  position: relative;
  overflow: hidden;
}

.delta-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, 
    transparent, 
    rgba(255, 255, 255, 0.2), 
    transparent);
  transition: left 0.6s ease;
}

.delta-btn:hover::before {
  left: 100%;
}

.delta-btn:hover {
  background: linear-gradient(135deg, #a30000, #8b0000, #660000);
  border-color: rgba(139, 0, 0, 0.8);
  color: #fff;
  box-shadow: 
    0 10px 30px rgba(139, 0, 0, 0.6),
    0 0 50px rgba(139, 0, 0, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.15),
    inset 0 -1px 0 rgba(0, 0, 0, 0.5);
}

.delta-btn:active {
  transform: scale(0.98);
  box-shadow: 
    0 5px 15px rgba(139, 0, 0, 0.5),
    0 0 30px rgba(139, 0, 0, 0.2);
}

/* === Output Box === */
#output {
  margin-top:30px;
  padding:18px;
  background: linear-gradient(145deg, #0d0000, #1a0505);
  border-radius:10px;
  color:#cc6666;
  font-family: 'Courier New', monospace;
  font-size: 15px;
  font-weight: 600;
  word-break: break-all;
  user-select: all;
  border: 1px solid rgba(139, 0, 0, 0.4);
  box-shadow: 
    inset 0 3px 10px rgba(0, 0, 0, 0.7),
    0 0 20px rgba(139, 0, 0, 0.2);
  min-height: 20px;
  text-shadow: 0 0 8px rgba(204, 102, 102, 0.4);
}

#output:empty {
  display: none;
}

/* === Copied message === */
#copiedMsg {
  margin-top:15px;
  font-size:14px;
  color:#b36666;
  opacity:0;
  transition: opacity 0.4s ease;
  font-weight: 600;
  text-shadow: 0 0 10px rgba(179, 102, 102, 0.6);
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="card">
  <img src="https://raw.githubusercontent.com/zxkuhl/KEY-system/refs/heads/main/XInject%20Logi.png" alt="Logo" class="logo">
  <h1>Xenerator</h1>
  <p>Click the button to generate your whitelist key.</p>
  <button id="genKey" class="delta-btn">Generate Key</button>
  <pre id="output"></pre>
  <div id="copiedMsg">Copied to clipboard!</div>
</div>

<script>
// === Firebase config ===
const firebaseConfig = {
  apiKey: "AIzaSyCDYErDzkUObLnPWJUwqOQcceqS2WyUWyM",
  authDomain: "key-system-5efa4.firebaseapp.com",
  databaseURL: "https://key-system-5efa4-default-rtdb.firebaseio.com/",
  projectId: "key-system-5efa4",
  storageBucket: "key-system-5efa4.appspot.com",
  messagingSenderId: "862359412770",
  appId: "1:862359412770:web:f55b955364b329dfbaa7b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Reference to system (replace with your actual DB path)
const systemRef = db.ref("system"); 

// Generate key function
function makeKey(){ return "FREE-" + Math.floor(Math.random()*1e10); }

const genKeyBtn = document.getElementById("genKey");
const output = document.getElementById("output");
const copiedMsg = document.getElementById("copiedMsg");

genKeyBtn.onclick = ()=>{
  // Cooldown disabled for testing
  systemRef.once("value", s=>{
    if(s.val() === false){
      output.innerText = "Key generation is disabled.";
      return;
    }
    const key = makeKey();
    const newKey = { key, active:true, expires:Date.now()+86400000, device:navigator.userAgent };
    db.ref("keys").push(newKey);
    output.innerText = key;
    localStorage.setItem("lastGen", Date.now());

    // Copy to clipboard
    navigator.clipboard.writeText(key).then(()=>{
      copiedMsg.style.opacity = 1;
      setTimeout(()=>{copiedMsg.style.opacity=0;},1500);
    });
  });
};
</script>

</body>
</html>
