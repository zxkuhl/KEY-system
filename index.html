<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> Key generation System</title>

<!-- Favicon -->
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/zxkuhl/KEY-system/main/IMG_0727.png?v=1">

<style>
body { 
  margin:0; 
  min-height:100vh; 
  background:#080808; 
  color:white; 
  font-family:system-ui, monospace; 
  display:flex; 
  flex-direction:column; 
  align-items:center; 
  justify-content:center;
}
.delta-box { 
  background:black; 
  border-radius:20px; 
  padding:30px; 
  text-align:center; 
  box-shadow:0 0 0 1px rgba(255,255,255,0.05); 
}
.delta-text { 
  font-weight:600; 
  margin-bottom:20px; 
}
.delta-btn { 
  background:white; 
  color:black; 
  border:none; 
  border-radius:16px; 
  padding:14px 24px; 
  font-weight:700; 
  cursor:pointer; 
}
.delta-btn:disabled { 
  opacity:0.4; 
}
pre { 
  background:#0d0d0d; 
  border-radius:12px; 
  padding:12px; 
  margin-top:16px; 
  color:#00ff9c; 
  overflow:auto; 
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="delta-box">
  <h1>ZTECH KEYS</h1>
  <p class="delta-text">Make a key to get whitelisted</p>
  <button id="genKey" class="delta-btn">Generate Key</button>
  <pre id="output"></pre>
</div>

<script>
// ================= FIREBASE =================
const firebaseConfig = {
  apiKey: "AIzaSyCDYErDzkUObLnPWJUwqOQcceqS2WyUWyM",
  authDomain: "key-system-5efa4.firebaseapp.com",
  databaseURL: "https://key-system-5efa4-default-rtdb.firebaseio.com/",
  projectId: "key-system-5efa4",
  storageBucket: "key-system-5efa4.appspot.com",
  messagingSenderId: "862359412770",
  appId: "1:862359412770:web:f55b955364b329dfbaa7b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Reference to system (replace with your actual DB path)
const systemRef = db.ref("system"); 

// ================= KEY GENERATION =================
function makeKey(){ 
  return "FREE-" + Math.floor(Math.random()*1e10); 
}

const genKeyBtn = document.getElementById("genKey");
const output = document.getElementById("output");

genKeyBtn.onclick = ()=>{
  const lastGen = localStorage.getItem("lastGen");
  if(lastGen && Date.now() - lastGen < 3600000){
    output.innerText = "You can only generate 1 key per hour.";
    return;
  }
  systemRef.once("value", s=>{
    if(s.val() === false) {
      output.innerText = "Key generation is disabled.";
      return;
    }
    const key = makeKey();
    const newKey = { 
      key, 
      active:true, 
      expires:Date.now()+86400000, 
      device: navigator.userAgent 
    };
    db.ref("keys").push(newKey);
    output.innerText = key;
    localStorage.setItem("lastGen", Date.now());
  });
};
</script>

</body>
</html>
