<style>

/* === Reset & Body === */

body {

  margin:0;

  padding:0;

  min-height:100vh;

  display:flex;

  justify-content:center;

  align-items:center;

  font-family: 'Segoe UI', system-ui, sans-serif;

  background: linear-gradient(135deg, #0a0010 0%, #1a051a 25%, #0d000d 50%, #150315 75%, #0a0010 100%);

  color:white;

  position: relative;

  overflow: hidden;

}

/* Static particles effect */

body::before {

  content: '';

  position: absolute;

  width: 100%;

  height: 100%;

  background-image: 

    radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),

    radial-gradient(circle at 80% 70%, rgba(75, 0, 130, 0.12) 0%, transparent 40%),

    radial-gradient(circle at 40% 80%, rgba(128, 0, 128, 0.1) 0%, transparent 40%);

  pointer-events: none;

}

/* === Container Card === */

.card {

  background: linear-gradient(145deg, #1a051a 0%, #0d000d 50%, #150315 100%);

  padding:50px 40px;

  border-radius:24px;

  box-shadow: 

    0 20px 60px rgba(0, 0, 0, 0.9),

    0 0 80px rgba(138, 43, 226, 0.3),

    inset 0 1px 1px rgba(200, 100, 255, 0.1);

  border: 1px solid rgba(138, 43, 226, 0.3);

  text-align:center;

  width: 400px;

  max-width: 90%;

  position: relative;

  z-index: 10;

  backdrop-filter: blur(10px);

  transition: all 0.4s ease;

}

.card::before {

  content: '';

  position: absolute;

  top: 0;

  left: 0;

  right: 0;

  bottom: 0;

  border-radius: 24px;

  padding: 2px;

  background: linear-gradient(135deg, 

    rgba(138, 43, 226, 0.3), 

    rgba(75, 0, 130, 0.2), 

    rgba(138, 43, 226, 0.3));

  -webkit-mask: 

    linear-gradient(#fff 0 0) content-box, 

    linear-gradient(#fff 0 0);

  -webkit-mask-composite: xor;

  mask-composite: exclude;

  pointer-events: none;

}

.card:hover {

  box-shadow: 

    0 25px 70px rgba(0, 0, 0, 0.95),

    0 0 100px rgba(138, 43, 226, 0.4),

    inset 0 1px 1px rgba(200, 100, 255, 0.15);

  border-color: rgba(138, 43, 226, 0.5);

}

/* Logo */

.logo {

  width: 110px;

  height: 110px;

  margin: 0 auto 30px;

  display: block;

  filter: drop-shadow(0 0 25px rgba(138, 43, 226, 0.5));

  transition: all 0.3s ease;

}

.logo:hover {

  filter: drop-shadow(0 0 35px rgba(138, 43, 226, 0.7));

  transform: scale(1.05);

}

.card h1 {

  margin-bottom:15px;

  font-family: 'Rajdhani', sans-serif;

  font-size: 48px;

  background: linear-gradient(135deg, #b47ede, #8b2fc9, #6b22ab, #8b2fc9);

  -webkit-background-clip: text;

  -webkit-text-fill-color: transparent;

  background-clip: text;

  font-weight: 800;

  letter-spacing: 8px;

  filter: drop-shadow(0 0 15px rgba(138, 43, 226, 0.5));

  position: relative;

  text-transform: uppercase;

}

.card h1::after {

  content: '';

  position: absolute;

  bottom: -10px;

  left: 50%;

  transform: translateX(-50%);

  width: 80px;

  height: 3px;

  background: linear-gradient(90deg, transparent, rgba(138, 43, 226, 0.8), transparent);

  box-shadow: 0 0 10px rgba(138, 43, 226, 0.5);

}

.card p {

  font-size:18px;

  margin-bottom:35px;

  margin-top: 25px;

  color:#c299e6;

  font-weight: 500;

  line-height: 1.6;

  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);

}

/* === Button Container === */

.button-container {

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 20px;

}

/* === Or Divider === */

.or-divider {

  color: #9966cc;

  font-size: 16px;

  font-weight: 600;

  letter-spacing: 1px;

  text-transform: uppercase;

}

/* === Discord Button === */

.discord-btn {

  background: linear-gradient(135deg, #8b2fc9, #6b22ab, #4b1a8d);

  color:#e0e0e0;

  border: 2px solid rgba(138, 43, 226, 0.5);

  border-radius:12px;

  padding:16px 40px;

  font-weight:700;

  font-size:15px;

  cursor:pointer;

  transition: all 0.3s ease;

  text-transform: uppercase;

  letter-spacing: 2px;

  box-shadow: 

    0 6px 20px rgba(138, 43, 226, 0.4),

    0 0 30px rgba(138, 43, 226, 0.2),

    inset 0 1px 0 rgba(255, 255, 255, 0.1),

    inset 0 -1px 0 rgba(0, 0, 0, 0.5);

  position: relative;

  overflow: hidden;

  text-decoration: none;

  display: inline-flex;

  align-items: center;

  gap: 12px;

}

.discord-btn::before {

  content: '';

  position: absolute;

  top: 0;

  left: -100%;

  width: 100%;

  height: 100%;

  background: linear-gradient(90deg, 

    transparent, 

    rgba(255, 255, 255, 0.2), 

    transparent);

  transition: left 0.6s ease;

}

.discord-btn:hover::before {

  left: 100%;

}

.discord-btn:hover {

  background: linear-gradient(135deg, #a347e0, #8b2fc9, #6b22ab);

  border-color: rgba(138, 43, 226, 0.8);

  color: #fff;

  box-shadow: 

    0 10px 30px rgba(138, 43, 226, 0.6),

    0 0 50px rgba(138, 43, 226, 0.3),

    inset 0 1px 0 rgba(255, 255, 255, 0.15),

    inset 0 -1px 0 rgba(0, 0, 0, 0.5);

  transform: translateY(-2px);

}

.discord-btn:active {

  transform: scale(0.98);

  box-shadow: 

    0 5px 15px rgba(138, 43, 226, 0.5),

    0 0 30px rgba(138, 43, 226, 0.2);

}

.discord-btn svg {

  width: 24px;

  height: 24px;

  fill: #e0e0e0;

  filter: drop-shadow(0 0 8px rgba(138, 43, 226, 0.5));

  transition: all 0.3s ease;

}

.discord-btn:hover svg {

  fill: #fff;

  filter: drop-shadow(0 0 12px rgba(138, 43, 226, 0.7));

}

/* === Linkvertise Button === */

.linkvertise-btn {

.linkvertise-btn::before {

  transition: left 0.6s ease;

}

.linkvertise-btn:hover::before {

.linkvertise-btn:hover {

const db = firebase.database();

function cleanExpiredKeys(){

  db.ref("keys").once("value", snap=>{

    snap.forEach(c=>{

    });

  });
